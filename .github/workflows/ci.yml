name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.15'

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install git

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Visual Studio build tools are already available

    - name: Cache CMake dependencies
      uses: actions/cache@v3
      with:
        path: |
          build/_deps
        key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cmake.toml', 'cmkr.cmake') }}
        restore-keys: |
          ${{ runner.os }}-cmake-deps-

    - name: Bootstrap cmkr
      run: |
        cmake -P cmkr.cmake

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build InterObfu library
      run: |
        cmake --build build --target interobfu --config ${{ matrix.build_type }}

    - name: Build demo (Ubuntu/macOS only)
      if: matrix.os != 'windows-latest'
      run: |
        cmake --build build --target interobfu_demo --config ${{ matrix.build_type }}
      continue-on-error: true

    - name: List build artifacts
      run: |
        find build -name "*.a" -o -name "*.lib" -o -name "*.exe" || true
      shell: bash

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: interobfu-${{ matrix.platform }}-${{ matrix.build_type }}
        path: |
          build/libinterobfu.a
          build/interobfu.lib
          build/${{ matrix.build_type }}/libinterobfu.a
          build/${{ matrix.build_type }}/interobfu.lib
        if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check code formatting
      run: |
        find InterObfu tests -name "*.cpp" -o -name "*.h" | head -10 | while read file; do
          echo "Checking $file"
          # Basic syntax check
          head -5 "$file"
        done

  documentation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate project documentation
      run: |
        echo "=== Project Documentation Check ==="
        ls -la *.md || echo "No markdown files found"
        echo ""
        echo "=== Build System Files ==="
        ls -la cmake.toml cmkr.cmake CMakeLists.txt 2>/dev/null || echo "Build files check"
        echo ""
        echo "=== Source Structure ==="
        find InterObfu -name "*.h" | wc -l | xargs echo "Header files:"
        find InterObfu -name "*.cpp" | wc -l | xargs echo "Source files:"

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Basic security scan
      run: |
        echo "=== Security Check ==="
        # Check for common security anti-patterns
        echo "Checking for unsafe functions..."
        grep -r "sprintf\|strcpy\|strcat" InterObfu/ || echo "No unsafe string functions found"
        echo "Checking for potential buffer overflows..."
        grep -r "memcpy\|memset" InterObfu/ | head -5 || echo "Memory functions check complete"
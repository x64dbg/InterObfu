name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v1.0.0'

jobs:
  build-release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            archive_name: interobfu-linux
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows
            archive_name: interobfu-windows
            archive_ext: zip
          - os: macos-latest
            platform: macos
            archive_name: interobfu-macos
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.15'

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install git

    - name: Bootstrap cmkr
      run: |
        cmake -P cmkr.cmake

    - name: Configure CMake (Release)
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build InterObfu library
      run: |
        cmake --build build --target interobfu --config Release

    - name: Prepare release package
      run: |
        mkdir -p release-package/lib
        mkdir -p release-package/include
        mkdir -p release-package/docs
        
        # Copy library
        find build -name "*.a" -o -name "*.lib" | head -1 | xargs -I {} cp {} release-package/lib/ || true
        
        # Copy headers
        cp InterObfu/*.h release-package/include/ 2>/dev/null || true
        
        # Copy documentation
        cp *.md release-package/docs/ 2>/dev/null || true
        cp cmake.toml release-package/ 2>/dev/null || true
        
        # Create README for release
        cat > release-package/README.txt << 'EOF'
        InterObfu - Intermediate x86 Instruction Representation
        =====================================================
        
        This package contains:
        - lib/: Static library files
        - include/: Header files for development
        - docs/: Documentation and examples
        - cmake.toml: Build configuration for cmkr
        
        To use in your project:
        1. Copy headers to your include path
        2. Link against the static library
        3. See docs/ for usage examples
        
        Build from source using cmkr.build:
        cmake -P cmkr.cmake
        cmake -B build
        cmake --build build
        EOF
      shell: bash

    - name: Create archive (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        tar -czf ${{ matrix.archive_name }}.${{ matrix.archive_ext }} -C release-package .

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd release-package
        7z a ../${{ matrix.archive_name }}.${{ matrix.archive_ext }} *

    - name: Upload release artifact
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.archive_name }}
        path: ${{ matrix.archive_name }}.${{ matrix.archive_ext }}

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Get release info
      id: release_info
      run: |
        echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "release_name=InterObfu ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        release_name: ${{ steps.release_info.outputs.release_name }}
        body: |
          ## InterObfu Release ${{ steps.release_info.outputs.tag_name }}
          
          ### Features
          - Intermediate x86 instruction representation
          - Pattern matching and peephole optimization
          - Cross-platform C++17 library
          - cmkr.build integration
          
          ### Downloads
          - **Linux**: `interobfu-linux.tar.gz`
          - **Windows**: `interobfu-windows.zip`  
          - **macOS**: `interobfu-macos.tar.gz`
          
          ### Build from Source
          ```bash
          git clone <repository>
          cd InterObfu
          cmake -P cmkr.cmake
          cmake -B build
          cmake --build build
          ```
          
          See documentation for usage examples and API reference.
        draft: false
        prerelease: false

    - name: Upload Linux Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./interobfu-linux/interobfu-linux.tar.gz
        asset_name: interobfu-linux.tar.gz
        asset_content_type: application/gzip

    - name: Upload Windows Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./interobfu-windows/interobfu-windows.zip
        asset_name: interobfu-windows.zip
        asset_content_type: application/zip

    - name: Upload macOS Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./interobfu-macos/interobfu-macos.tar.gz
        asset_name: interobfu-macos.tar.gz
        asset_content_type: application/gzip